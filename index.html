<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Otavio Zanon — Interactive Terminal Portfolio</title>
    <meta name="description" content="A command-line style developer portfolio that lets you explore professional experience, technical skills, and projects by typing terminal commands." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://otaviozanon.vercel.app" />
    <meta property="og:title" content="Otavio Zanon — Interactive Terminal Portfolio" />
    <meta property="og:description" content="A command-line style developer portfolio that lets you explore professional experience, technical skills, and projects by typing terminal commands." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://otaviozanon.vercel.app" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Otavio Zanon — Interactive Terminal Portfolio" />
    <meta name="twitter:description" content="A command-line style developer portfolio that lets you explore professional experience, technical skills, and projects by typing terminal commands." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <pre id="bannerArt"></pre>
        <div class="tagline"></div>
      </div>

      <div class="window">
        <div class="titlebar">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="label">user@github: ~</div>
          <button class="lang-toggle" id="langToggle" title="Switch language">
            EN
          </button>
        </div>
        <div class="term" id="term"></div>
        <div class="inputRow">
          <span class="prompt-tag">user@github:~$</span>
          <input
            id="cmdInput"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <span class="cursor" id="fakeCursor"></span>
        </div>
      </div>

      <div class="hint">
        type <kbd>help</kbd> to see commands · try <kbd>projects</kbd>,
        <kbd>skills</kbd>, or <kbd>experience</kbd>
      </div>

      <footer>
        <div class="links"></div>
        <div class="tagline-text"></div>
        <div>rendered client-side, no build step</div>
      </footer>
    </div>

    <div id="tooltip"></div>

    <script src="js/config.js"></script>
    <script src="js/heatmap.js"></script>
    <script src="js/resume.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
